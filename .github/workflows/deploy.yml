name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allows re-running a deployment by hand from the Actions tab
  workflow_dispatch:

# Only what deploying to Pages needs; the token can't push code or touch
# anything else in the repository
permissions:
  contents: read
  pages: write
  id-token: write

# If two pushes land close together, let the first deployment finish
# instead of cancelling it halfway and leaving the site half-updated
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Same Node version as local development, so a build that works
          # on the developer's machine also works here
          node-version-file: .nvmrc
          cache: npm

      # `ci` instead of `install`: installs exactly what package-lock.json
      # says and fails if it is out of sync with package.json
      - run: npm ci

      # Checks run before building so broken code is never published
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

      # Pages answers unknown paths such as /mesura/foods with 404.html.
      # Making it a copy of the app lets the app load anyway and React
      # Router show the right screen, so reloading or sharing a link works.
      - run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
